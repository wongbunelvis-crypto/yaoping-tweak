name: BuildDeb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos deps
        run: |
          brew install ldid dpkg make

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C "$THEOS/sdks" --strip-components=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build package
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YaopingCtl-deb
          path: packages/*.deb

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
